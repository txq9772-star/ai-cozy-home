# 住户会做的事。一条一个，加新的直接往下写。
#   label   页面上显示的「正在做什么」
#   spots   去哪做：房间模板里 spot 的 tags。卧室里的位置只有主人自己会去
#   source  要不要刷到内容：bilibili / rss / shelf，不写 = 不需要内容
#   app     用什么（写进动态，比如「用Bilibili」）
#   text    动态的写法：{place} 地点，{app} 应用，{title} 标题，{site} 来源名
#   think   true = 这件事会调用模型写感想（还要再乘 life.think_chance）；false = 只记动态，不花额度
#   weight  没写进 likes 时的默认权重（不写按 1）
#   daytime true = 只有白天（7 点到 19 点）才去
#   together true = 要拉上另一个醒着的住户，两人各占一个位置；text 里 {with} 是对方名字
#   festival true = 只有节日那天才做；text 里 {festival} 是节日名字
#   weather  只在这种天气做：clear / cloudy / rain
#   emote   头顶的小图标；anim 身体动作；prop 手里拿的东西（都在 web/js/people.js）
#   roam    true = 做的时候在屋里走来走去
#   visit   true = 去别人房间串门，spots 不用写
#   things  这次具体弄的东西，随机挑一个：做的什么菜、泡的什么茶。text_thing 是有 {thing} 时用的写法，doing 是给模型看的「在做什么」
#   kitchen cook 做的菜会剩下 / eat 优先吃剩菜 / wash 洗做饭用过的锅
#   gives   做这件事补多少需求：energy 精力、hunger 饱腹、social 社交、fun 开心。缺得越多越想做
# 用到户外位置的活动下雨时不会去。
# 住户配置里的 likes 是各自的偏好权重，没写的活动按 weight 算。

video:
  label: 刷视频
  spots: [sofa, beanbag, rug]
  source: bilibili
  app: Bilibili
  text: "在{place}用{app}，看了《{title}》"
