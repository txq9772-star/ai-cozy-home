<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小窝</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%23e98a3b'/%3E%3Cpath d='M12 27v-7h8v7' fill='%23fff3e2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/style.css">
<script type="importmap">
{"imports": {"three": "/web/vendor/three/three.module.js", "three/addons/": "/web/vendor/three/addons/"}}
</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<header class="topbar">
  <span class="pill brand" id="home-name">小窝</span>
  <span class="pill" id="home-clock">小窝时间 · --</span>
  <span class="pill" id="home-who">在家：--</span>
  <span class="pill" id="home-weather">--</span>
  <span class="pill warn hidden" id="home-mode"></span>
  <button class="pill round" id="rot-left" title="向左转">⟲</button>
  <button class="pill round" id="rot-right" title="向右转">⟳</button>
  <button class="pill" id="view-all">全景</button>
</header>

<aside class="rail">
  <button data-panel="feed" class="on" title="动态">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></button>
  <button data-panel="people" title="住户">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.4 3-5 5.5-5s4.9 1.6 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.3 0 4.3 1.3 4.9 4.6"/></svg></button>
  <button data-panel="notes" title="留言">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12.5" rx="2"/><path d="m4 7.5 8 6 8-6"/></svg><i class="badge hidden" id="notes-badge"></i></button>
  <button data-panel="daily" title="日报">
    <svg viewBox="0 0 24 24"><path d="M6 3.5h12v17H6z"/><path d="M9 8h6M9 12h6M9 16h3.5"/></svg></button>
  <button id="open-replay" title="回放">
    <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5L4.5 8.7"/><path d="M4.5 4.5v4.2h4.2"/><path d="M12 8v4.3l3 1.7"/></svg></button>
  <button data-panel="settings" title="设置">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  <button id="toggle-look" title="3D 小人 / 立绘">
    <svg viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg></button>
  <button id="toggle-sky" title="预览白天 / 夜晚">
    <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
</aside>

<section class="panel side" id="panel-feed">
  <div class="panel-head"><b>动态</b><span class="hint" title="住户在小窝里做的事。点「看到了」告诉她你看过了">ⓘ</span>
    <button class="x" data-close>×</button></div>
  <div class="feed" id="feed"></div>
</section>

<section class="panel side hidden" id="panel-people">
  <div class="panel-head"><b>住户</b><button class="x" data-close>×</button></div>
  <div class="people" id="people"></div>
</section>

<section class="panel side hidden" id="panel-notes">
  <div class="panel-head"><b>留言</b><button class="x" data-close>×</button></div>
  <div class="notes" id="notes"></div>
  <form class="note-add" id="note-add">
    <select id="note-to" aria-label="留给谁"></select>
    <input id="note-text" maxlength="300" autocomplete="off" placeholder="留句话，醒着的时候会看到">
    <button class="btn primary">留言</button>
  </form>
</section>

<section class="panel side hidden" id="panel-daily">
  <div class="panel-head"><button class="x nav" id="daily-prev" title="前一天">‹</button><b id="daily-day">日报</b><button class="x nav" id="daily-next" title="后一天">›</button><button class="x nav wk" id="daily-week" title="这一周">周</button><button class="x" data-close>×</button></div>
  <div class="daily" id="daily"></div>
</section>

<section class="panel side hidden" id="panel-settings">
  <div class="panel-head"><b>设置</b><button class="x" data-close>×</button></div>
  <div class="settings" id="settings"></div>
</section>

<section class="panel chat" id="panel-chat">
  <div class="panel-head"><b>聊天</b><button class="x" id="chat-min" title="收起">–</button></div>
  <div class="chat-body">
    <div class="msgs" id="msgs"></div>
    <form class="say" id="say">
      <input id="say-text" autocomplete="off" placeholder="跟家里说点什么…">
      <button type="submit">发送</button>
    </form>
    <div class="chips" id="chips"></div>
    <details class="pending" id="pending"><summary>刚才谁想说话 <span id="pending-n"></span></summary><div id="pending-list"></div></details>
  </div>
</section>

<div class="replay hidden" id="replay">
  <div class="rp-row">
    <button class="btn" id="rp-prev" title="前一天">‹</button><b id="rp-day"></b><button class="btn" id="rp-next" title="后一天">›</button>
    <span id="rp-time">--:--</span>
    <button class="btn primary" id="rp-play">播放</button>
    <button class="btn" id="rp-speed"></button>
    <button class="btn" id="rp-exit">回到现在</button>
  </div>
  <input type="range" id="rp-range" step="30" aria-label="时间">
  <div id="rp-caption"></div>
</div>

<div class="card hidden" id="card"></div>
<div class="toast hidden" id="toast"></div>

<script type="module" src="/web/js/main.js"></script>
</body>
</html>
