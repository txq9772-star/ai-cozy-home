# 户外模板：游乐场和草坪。放在大门外（home.yaml 的 outdoors 列表），没有墙和屋顶。
# 坐标相对场地中心，x 向东、z 向南，北边紧贴房子。西边一半是游乐设施，东边一半是空草坪。
# spot 的 ride / seat 指向 furniture 的 ride，住户到了就跟着设施动。
name: 游乐场
icon: park
kind: outdoor
size: [42, 18]
label: [-11, 8.2]
furniture:
  - {type: path_stones, x: 0, z: 0, pts: [[2.6, -9], [2.4, -6], [1.6, -2], [0.8, 2], [0.4, 6], [0, 9]]}
  # ---------- 西边：游乐设施
  - {type: pad, x: -15, z: -4.4, w: 8, d: 5.2, color: "#c9785f"}
  - {type: swing, x: -15, z: -4.4, ride: swing1}
  - {type: pad, x: -6.2, z: -4.2, w: 5.6, d: 8, color: "#8fae74"}
  - {type: slide, x: -6.5, z: -4.4, ride: slide1}
  - {type: pad, x: -15, z: 4.6, w: 7.4, d: 3.6, color: "#6f97bd"}
  - {type: seesaw, x: -15, z: 4.6, ride: seesaw1}
  - {type: pad, x: -6.5, z: 4.4, w: 5.4, d: 5.4, color: "#e2bd68"}
  - {type: carousel, x: -6.5, z: 4.4, ride: carousel1}
  - {type: sandbox, x: -15.5, z: 0.5, w: 4.4, d: 3.0}
  - {type: bench, x: -10.6, z: -7.7, face: s}
  - {type: tree_big, x: -19.6, z: -7.4}
  - {type: tree_big, x: -19.4, z: 7.6, s: 0.9}
  - {type: tree_big, x: -10.8, z: 7.9, s: 0.8}
  - {type: flowers, x: -15, z: -8.2, w: 5, d: 0.9}
  - {type: flowers, x: -3.6, z: 8.1, w: 3.4, d: 1.0}
  - {type: lamp_post, x: -2.4, z: -6.6}
  - {type: lamp_post, x: -11, z: 1.2}
  # ---------- 东边：空草坪，野餐、放风筝、扔飞盘
  - {type: rug, x: 9, z: -3.5, w: 3.2, d: 2.4, color: "#e98a7a"}
  - {type: basket, x: 9, z: -3.5}
  - {type: rug, x: 9, z: 4.2, w: 3.2, d: 2.4, color: "#8fb7d9"}
  - {type: basket, x: 9, z: 4.2}
  - {type: tree_big, x: 16.8, z: -5.2, s: 1.25}
  - {type: tree_big, x: 19.6, z: 7.4, s: 0.85}
  - {type: bench, x: 19.6, z: 0.4, face: w}
  - {type: flowers, x: 6.4, z: -8.2, w: 5, d: 0.9}
  - {type: flowers, x: 14, z: 8.1, w: 4, d: 1.0}
  - {type: lamp_post, x: 4.6, z: 1.2}
  - {type: lamp_post, x: "e-0.8", z: -3}
  # ---------- 四周绿篱，南边留口子通湖
  - {type: hedge, x: 0, z: "s-0.3", len: 42, gap_at: 0, gap: 2.4}
  - {type: hedge, x: "w+0.3", z: 0, len: 17.4, rot: 90}
  - {type: hedge, x: "e-0.3", z: 0, len: 17.4, rot: 90}
