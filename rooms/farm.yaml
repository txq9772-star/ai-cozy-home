# 户外模板：农场。接在湖边南边（湖的 exit_at 让门开在东岸），默认就有，home.yaml 写 farm: false 就不要。
# 坐标相对场地中心，x 向东、z 向南。西边三分之二是田，东边是粮仓、农机棚和牲口圈。
# field：一块地。plot 是地块编号（别重复），crop 是种什么（rice 稻 / wheat 麦 / corn 玉米 / potato 土豆），name 写进动态。
# pen：一个圈。pen 是编号，kind 是 cow / sheep / chicken，gate 是门开在哪面墙、gate_at 是门在那面墙上的位置。
# machine：一台农机。ride 和 spot 的 ride 对上，人坐上去它才开。road_z 是主路，gaps 是田之间能开车的缝，gate 是拉粮出门的地方。
# spot 的 target：农机写能收的作物（逗号隔开），圈旁边写圈的编号，田边写地块编号。
name: 农场
icon: farm
kind: outdoor
size: [96, 60]
label: [27, -28.2]
furniture:
